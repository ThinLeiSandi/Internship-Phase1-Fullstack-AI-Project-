services:
  # Service 1: PostgreSQL Database Container
  postgres-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Node.js Express API Container
  api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres-db:5432/myapp?schema=public"
      JWT_SECRET: "my_docker_super_secret_jwt_key_12345"
      NODE_ENV: "production"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
